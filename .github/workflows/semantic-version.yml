name: Semantic version

on:
  pull_request:
    types: [closed]

concurrency:
  group: semantic-version-master
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  version:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'master'
    runs-on: ubuntu-latest
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Select release increment
        id: increment
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          if [[ ",$LABELS," == *",release:minor,"* ]]; then
            echo "level=minor" >> "$GITHUB_OUTPUT"
          else
            echo "level=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Update version
        env:
          LEVEL: ${{ steps.increment.outputs.level }}
        run: npm version "$LEVEL" --no-git-tag-version

      - name: Commit and tag version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: release v$VERSION"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push --atomic origin HEAD:master "refs/tags/v$VERSION"
