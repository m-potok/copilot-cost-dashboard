name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run type-check
      - run: npm run build:exe
      - run: Get-FileHash dist\copilot-cost-dashboard.exe -Algorithm SHA256
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: copilot-cost-dashboard-windows
          path: dist\copilot-cost-dashboard.exe
